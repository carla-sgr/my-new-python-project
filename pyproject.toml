[project]
name = "my-new-python-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
]

[project.scripts]
my-new-python-project = "my_new_python_project:main"

